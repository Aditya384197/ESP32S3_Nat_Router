name: Build Firmware

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Router Build
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -euo pipefail

          . /opt/esp/idf/export.sh

          echo "ESP-IDF version:"
          idf.py --version

          echo "Setting ESP32-S3 target..."
          idf.py set-target esp32s3

          echo "Cleaning previous build..."
          idf.py fullclean

          echo "Building firmware..."
          idf.py build

          echo "Generating partition table..."
          idf.py partition-table

          echo "Generating size report..."
          idf.py size

          echo "Creating merged firmware image..."
          idf.py merge-bin \
            -o "$(pwd)/build/merged.bin" \
            -f raw

          echo "Merged firmware created:"
          ls -lh "$(pwd)/build/merged.bin"

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying firmware outputs..."

          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin
          test -s build/ota_data_initial.bin
          test -s build/esp32s3_nat_router.bin
          test -s build/merged.bin
          test -s build/flash_args

          # phy_init_data.bin is not generated by every ESP-IDF configuration.
          # Do not fail the complete build if it is absent.
          if [ -s build/phy_init_data.bin ]; then
            echo "Verified: build/phy_init_data.bin"
          else
            echo "INFO: build/phy_init_data.bin not generated by this configuration."
          fi

          echo
          echo "Build outputs verified successfully."

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          cp build/bootloader/bootloader.bin \
            artifacts/bootloader.bin

          cp build/partition_table/partition-table.bin \
            artifacts/partition-table.bin

          cp build/ota_data_initial.bin \
            artifacts/ota_data_initial.bin

          cp build/esp32s3_nat_router.bin \
            artifacts/esp32s3_nat_router.bin

          cp build/merged.bin \
            artifacts/merged.bin

          cp build/flash_args \
            artifacts/flash_args

          if [ -s build/phy_init_data.bin ]; then
            cp build/phy_init_data.bin \
              artifacts/phy_init_data.bin
          fi

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying collected artifacts..."

          for file in \
            artifacts/bootloader.bin \
            artifacts/partition-table.bin \
            artifacts/ota_data_initial.bin \
            artifacts/esp32s3_nat_router.bin \
            artifacts/merged.bin \
            artifacts/flash_args
          do
            test -s "$file"
            echo "Verified: $file"
          done

          if [ -s artifacts/phy_init_data.bin ]; then
            echo "Verified: artifacts/phy_init_data.bin"
          fi

          echo
          echo "All firmware artifacts verified successfully."

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Router
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
